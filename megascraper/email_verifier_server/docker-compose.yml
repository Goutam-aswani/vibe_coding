version: '3.8'

services:
  api:
    build: .
    container_name: email-verifier-api
    ports:
      - "8001:8001"
    environment:
      - EMAILVERIFIER_SESSION_COOKIE=${EMAILVERIFIER_SESSION_COOKIE}
      - API_KEY=${API_KEY:-}
      - HOST=0.0.0.0
      - PORT=8001
      - WORKERS=4
      - RATE_LIMIT_DELAY=1.0
      - MAX_CONCURRENT=5
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

